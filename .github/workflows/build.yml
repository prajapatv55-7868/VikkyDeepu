name: Build Safe Gallery APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto-Organize & Generate Clean Manifest + Gradle
        run: |
          mkdir -p app/src/main/res/values

          # 1. Detect Package Name and MainActivity Name from .kt files
          PKG_NAME="com.example.safegallery"
          MAIN_ACT="MainActivity"

          for ktfile in *.kt app/src/main/java/**/*.kt; do
            if [ -f "$ktfile" ]; then
              DETECTED_PKG=$(grep -m 1 "^package " "$ktfile" | awk '{print $2}' | tr -d '\r;')
              if [ -n "$DETECTED_PKG" ]; then
                PKG_NAME="$DETECTED_PKG"
              fi
              PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
              mkdir -p "app/src/main/java/$PKG_PATH"
              cp -f "$ktfile" "app/src/main/java/$PKG_PATH/" 2>/dev/null || true
            fi
          done
          rm -f *.kt

          # 2. Clean any corrupted root files
          rm -f *gradle* AndroidManifest.xml

          # 3. Generate a 100% Clean, Error-Free AndroidManifest.xml
          cat << EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" tools:node="remove" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" tools:node="remove" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED" />

              <application
                  android:allowBackup="false"
                  android:fullBackupContent="false"
                  android:label="Safe Gallery"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 4. Generate app/build.gradle.kts
          cat << EOF > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "$PKG_NAME"
              compileSdk = 34

              defaultConfig {
                  applicationId = "$PKG_NAME"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.biometric:biometric:1.1.0")
              implementation("androidx.security:security-crypto:1.1.0-alpha06")
              implementation("io.coil-kt:coil-compose:2.6.0")
              implementation("io.coil-kt:coil-video:2.6.0")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.room:room-runtime:2.6.1")
              implementation("androidx.room:room-ktx:2.6.1")
              ksp("androidx.room:room-compiler:2.6.1")
          }
          EOF

          # 5. Create Root settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SafeGallery"
          include(":app")
          EOF

          # 6. Create Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.google.devtools.ksp") version "1.9.24-1.0.20" apply false
          }
          EOF

          # 7. Create gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeGallery-APK
          path: app/build/outputs/apk/debug/*.apk
