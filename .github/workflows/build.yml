name: Build Safe Gallery APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto-Organize Files into Android Structure
        run: |
          mkdir -p app/src/main/res/values
          
          # 1. Move build.gradle.kts to app/ if it's in root
          if [ -f "build.gradle.kts" ]; then
            mv build.gradle.kts app/build.gradle.kts
          fi

          # 2. Move AndroidManifest.xml to app/src/main/
          if [ -f "AndroidManifest.xml" ]; then
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          # 3. Auto-detect package and move all .kt files to proper folder
          for ktfile in *.kt; do
            if [ -f "$ktfile" ]; then
              PKG=$(grep -m 1 "^package " "$ktfile" | awk '{print $2}' | tr -d '\r;')
              if [ -z "$PKG" ]; then
                PKG="com.example.safegallery"
              fi
              PKG_PATH=$(echo "$PKG" | tr '.' '/')
              mkdir -p "app/src/main/java/$PKG_PATH"
              mv "$ktfile" "app/src/main/java/$PKG_PATH/"
            fi
          done

          # 4. Remove launcher icons reference from Manifest if mipmap is missing
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:icon="[^"]*"//g' app/src/main/AndroidManifest.xml
            sed -i 's/android:roundIcon="[^"]*"//g' app/src/main/AndroidManifest.xml
          fi

          # 5. Create Root settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SafeGallery"
          include(":app")
          EOF

          # 6. Create Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.google.devtools.ksp") version "1.9.24-1.0.20" apply false
          }
          EOF

          # 7. Create gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeGallery-APK
          path: app/build/outputs/apk/debug/*.apk
