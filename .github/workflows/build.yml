name: Build Safe Gallery APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto-Organize & Generate Complete Android Config
        run: |
          mkdir -p app/src/main/res/values

          # 1. Move any Manifest file to app/src/main/
          find . -maxdepth 2 -iname "*Manifest*.xml" -exec cp -f {} app/src/main/AndroidManifest.xml \;

          # 2. Move all .kt files into their exact package folder
          PKG_NAME="com.example.safegallery"
          for ktfile in *.kt; do
            if [ -f "$ktfile" ]; then
              DETECTED_PKG=$(grep -m 1 "^package " "$ktfile" | awk '{print $2}' | tr -d '\r;')
              if [ -n "$DETECTED_PKG" ]; then
                PKG_NAME="$DETECTED_PKG"
              fi
              PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
              mkdir -p "app/src/main/java/$PKG_PATH"
              mv -f "$ktfile" "app/src/main/java/$PKG_PATH/"
            fi
          done

          # 3. Clean any root gradle files so they don't conflict
          rm -f *gradle*

          # 4. Clean missing icon/theme references in Manifest
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:icon="[^"]*"//g' app/src/main/AndroidManifest.xml
            sed -i 's/android:roundIcon="[^"]*"//g' app/src/main/AndroidManifest.xml
            sed -i 's/android:theme="[^"]*"/android:theme="@android:style\/Theme.Material.Light.NoActionBar"/g' app/src/main/AndroidManifest.xml
          fi

          # 5. Create guaranteed working app/build.gradle.kts
          cat << EOF > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "$PKG_NAME"
              compileSdk = 34

              defaultConfig {
                  applicationId = "$PKG_NAME"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.biometric:biometric:1.1.0")
              implementation("androidx.security:security-crypto:1.1.0-alpha06")
              implementation("io.coil-kt:coil-compose:2.6.0")
              implementation("io.coil-kt:coil-video:2.6.0")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.room:room-runtime:2.6.1")
              implementation("androidx.room:room-ktx:2.6.1")
              ksp("androidx.room:room-compiler:2.6.1")
          }
          EOF

          # 6. Create Root settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SafeGallery"
          include(":app")
          EOF

          # 7. Create Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.google.devtools.ksp") version "1.9.24-1.0.20" apply false
          }
          EOF

          # 8. Create gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeGallery-APK
          path: app/build/outputs/apk/debug/*.apk
